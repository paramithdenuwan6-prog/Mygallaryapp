name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create settings.gradle
      run: |
        echo "pluginManagement {" > settings.gradle
        echo "    repositories {" >> settings.gradle
        echo "        google()" >> settings.gradle
        echo "        mavenCentral()" >> settings.gradle
        echo "        gradlePluginPortal()" >> settings.gradle
        echo "    }" >> settings.gradle
        echo "}" >> settings.gradle
        echo "dependencyResolutionManagement {" >> settings.gradle
        echo "    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)" >> settings.gradle
        echo "    repositories {" >> settings.gradle
        echo "        google()" >> settings.gradle
        echo "        mavenCentral()" >> settings.gradle
        echo "    }" >> settings.gradle
        echo "}" >> settings.gradle
        echo "rootProject.name = 'Mygalleryapp'" >> settings.gradle
        echo "include ':app'" >> settings.gradle

    - name: Create build.gradle (App)
      run: |
        mkdir -p app
        echo "plugins { id 'com.android.application' }" > app/build.gradle
        echo "android {" >> app/build.gradle
        echo "    namespace 'com.example.botapp'" >> app/build.gradle
        echo "    compileSdk 33" >> app/build.gradle
        echo "    defaultConfig {" >> app/build.gradle
        echo "        applicationId 'com.example.botapp'" >> app/build.gradle
        echo "        minSdk 21" >> app/build.gradle
        echo "        targetSdk 33" >> app/build.gradle
        echo "        versionCode 1" >> app/build.gradle
        echo "        versionName '1.0'" >> app/build.gradle
        echo "    }" >> app/build.gradle
        echo "}" >> app/build.gradle

    - name: Build Debug APK
      run: gradle wrapper; ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
