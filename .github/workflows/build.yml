name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create build.gradle (Root)
      run: |
        echo "buildscript { repositories { google() mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.0' } }" > build.gradle

    - name: Create settings.gradle
      run: |
        echo "pluginManagement { repositories { google() mavenCentral() gradlePluginPortal() } } dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS) repositories { google() mavenCentral() } } rootProject.name = 'Mygalleryapp' include ':app'" > settings.gradle

    - name: Create build.gradle (App)
      run: |
        mkdir -p app
        echo "plugins { id 'com.android.application' } android { namespace 'com.example.botapp' compileSdk 33 defaultConfig { applicationId 'com.example.botapp' minSdk 21 targetSdk 33 versionCode 1 versionName '1.0' } } " > app/build.gradle

    - name: Build Debug APK
      run: chmod +x gradlew || true; gradle wrapper; ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
